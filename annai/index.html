<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2e5d34">
<title>みどり造園 ゲームと社内マップ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/midori-senmu-192.png">
<link rel="apple-touch-icon" href="../icons/midori-senmu-192.png">
<style>
  :root{ --midori:#2e5d34; --kami:#f4f1e8; --shiro:#ffffff; --sumi:#243324; --usui:#dfe8da; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:var(--kami); color:var(--sumi);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif; }
  .obi{ background:var(--midori); color:#fff; font-size:13px; letter-spacing:.12em;
    padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px; }
  main{ max-width:560px; margin:0 auto; padding:22px 16px 40px; }
  .badge{ display:inline-block; background:var(--midori); color:#fff; font-size:13px; font-weight:700;
    letter-spacing:.1em; padding:4px 12px; border-radius:4px; }
  h1{ font-size:26px; line-height:1.4; margin:12px 0 6px; }
  h1 em{ font-style:normal; color:var(--midori); }
  .lead{ font-size:15px; line-height:1.7; margin:0 0 22px; color:#4a5a48; }
  a.btn{ position:relative; display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--sumi);
    background:var(--shiro); border-radius:16px; padding:18px 16px 18px 20px; margin:0 0 14px;
    border-left:8px solid var(--midori); box-shadow:0 2px 8px rgba(36,51,36,.12); overflow:hidden; }
  a.btn:active{ transform:translateY(1px); box-shadow:0 1px 3px rgba(36,51,36,.2); }
  .ban{ position:absolute; right:52px; top:50%; transform:translateY(-52%); font-size:84px; font-weight:800;
    line-height:1; color:var(--usui); pointer-events:none; }
  .e{ font-size:34px; line-height:1; position:relative; }
  .t{ position:relative; flex:1; min-width:0; }
  .t b{ display:block; font-size:21px; }
  .t span{ display:block; font-size:14px; line-height:1.5; color:#4a5a48; margin-top:3px; }
  .ya{ position:relative; font-size:22px; font-weight:700; color:var(--midori); }
  .oki{ background:var(--shiro); border-top:4px solid var(--midori); border-radius:0 0 12px 12px;
    padding:12px 14px; margin-top:22px; font-size:14px; line-height:1.7; }
  .oki b{ color:var(--midori); }
  footer{ text-align:center; font-size:12px; color:#6b7a68; padding:0 16px calc(20px + env(safe-area-inset-bottom,0px)); }
</style>
</head>
<body>
<div class="obi">みどり造園｜ご案内</div>
<main>
  <span class="badge">ごあんない</span>
  <h1>みどり造園の<em>ゲーム</em>と<em>社内マップ</em></h1>
  <p class="lead">社内で作って使っている物を、2つ開けるようにしました。押すと新しい画面で開きます。</p>

  <a class="btn" href="https://helmetto2-prog.github.io/midori-games/" target="_blank" rel="noopener">
    <span class="ban">1</span>
    <span class="e">🎮</span>
    <span class="t"><b>ゲーム</b><span>みどりのゲームひろば。自作のゲームがならんでいます。</span></span>
    <span class="ya">›</span>
  </a>

  <a class="btn" href="https://helmetto2-prog.github.io/shanaimap/" target="_blank" rel="noopener">
    <span class="ban">2</span>
    <span class="e">🗺</span>
    <span class="t"><b>社内マップ</b><span>資材置き場の地図。番号を押すと、その場所の写真と置いてある物が出ます。</span></span>
    <span class="ya">›</span>
  </a>

  <div class="oki"><b>スマホに置く時</b>　ブラウザのメニューから「ホーム画面に追加」を選ぶと、アプリのように開けます。</div>
</main>
<footer>🌲 みどり造園</footer>
</body>
</html>
