<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スナック キャッツアイさんへ</title>
<style>
  :root{ --ink:#f3e9d6; --gold:#e0b355; --navy:#0d1420; --amber:#ffb75e; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:radial-gradient(circle at 50% 18%, #1c2b40 0%, #101a28 45%, #070b12 100%);
    color:var(--ink); font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    min-height:100vh; padding:26px 16px 48px; text-align:center;
  }
  .eye{ width:62px;height:62px;margin:0 auto 14px; border-radius:50%;
        background:radial-gradient(circle at 50% 50%, #ffcf7a 0%, #d99a2e 55%, #7a5410 100%);
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 0 26px rgba(255,183,94,.45), inset 0 0 12px rgba(0,0,0,.35); }
  .eye i{ display:block;width:11px;height:40px;border-radius:50%/50%;background:#12070a;
          box-shadow:0 0 6px rgba(0,0,0,.6); }
  h1{ font-size:clamp(21px,5.4vw,34px); letter-spacing:.12em; font-weight:normal; line-height:1.5; }
  h1 b{ color:var(--gold); font-weight:normal; }
  .sub{ font-size:clamp(11px,2.8vw,14px); color:#9aa7b8; letter-spacing:.24em; margin-top:9px; }
  .frame{ margin:26px auto 0; max-width:940px; border-radius:14px; overflow:hidden;
          box-shadow:0 16px 46px rgba(0,0,0,.6), 0 0 0 1px rgba(224,179,85,.35), 0 0 0 7px rgba(255,255,255,.03); }
  .frame img{ display:block; width:100%; height:auto; }
  .cap{ color:#c9bda6; margin-top:14px; line-height:1.9; letter-spacing:.04em; }
  .strip{ margin:26px auto 0; max-width:940px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .strip figure{ flex:1 1 240px; max-width:300px; }
  .strip img{ width:100%; height:auto; display:block; border-radius:10px;
              box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 1px rgba(224,179,85,.25); }
  .strip figcaption{ font-size:12px; color:#94a2b4; margin-top:7px; letter-spacing:.06em; }
  .note{ max-width:640px; margin:34px auto 0; font-size:clamp(11.5px,2.9vw,13.5px);
         color:#8d99aa; line-height:2; letter-spacing:.03em;
         border-top:1px solid rgba(224,179,85,.22); padding-top:18px; }
  .sig{ margin-top:22px; font-size:13px; color:var(--gold); letter-spacing:.2em; }
</style>
</head>
