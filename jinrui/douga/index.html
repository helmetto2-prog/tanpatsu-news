<h1>村のアニメ</h1>
<p class="small">台の上の模型（ジオラマ）で、村の1年をふり返る動画です。どれも54秒・縄文の音の曲つき。いまは6年目です。</p>
<section class="card"><h2>1年目　村の案内</h2>
<video controls playsinline preload="none" poster="../annai/poster.jpg" width="1280" height="720"><source src="../annai/jinrui_annai_720p.mp4" type="video/mp4"></video>
<p class="small">場面：はじまり（村の全景）／夏の雪の森を見つける／実りの秋／ネムリアナ／住人の暮らし／天への願い</p></section>
<section class="card"><h2>2年目の村</h2>
<video controls playsinline preload="none" poster="../annai/poster_y0002.jpg" width="1280" height="720"><source src="../annai/jinrui_y0002_720p.mp4" type="video/mp4"></video>
<p class="small">場面：湧き水のシブニゲ／クリの芽が三つ／足あとを読む／父カシを見つけて背負う／オオイシで数える／天への願い</p>
</section>
<section class="card"><h2>3年目の村</h2>
<video controls playsinline preload="none" poster="../annai/poster_y0003.jpg" width="1280" height="720"><source src="../annai/jinrui_y0003_720p.mp4" type="video/mp4"></video>
<p class="small">場面：雪をはね返す木／流れ着いたうつろな流木／浜の小屋のハマモリ／ハネギが鳴る／冬の蓄えと棒えらび／天への願い</p>
</section>
