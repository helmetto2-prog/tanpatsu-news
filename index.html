<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📰 単発ニュースの棚</title>
<style>
  :root{ --bg:#f6f4ec; --card:#ffffff; --ink:#2b3226; --sub:#7a8471; --accent:#3a7d44; --line:#dcd8c8; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--bg); color:var(--ink); min-height:100vh;
        font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif; padding:26px 14px 60px; }
  header{ text-align:center; margin-bottom:22px; }
  h1{ font-size:clamp(22px,5.6vw,32px); color:var(--accent); letter-spacing:.05em; }
  h1 small{ display:block; font-size:11px; color:var(--sub); letter-spacing:.32em; margin-bottom:6px; font-weight:normal; }
  #lead{ font-size:12.5px; color:var(--sub); margin-top:8px; line-height:1.8; }
  #list{ max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  a.item{ display:block; background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px 18px; text-decoration:none; color:inherit; box-shadow:0 2px 10px rgba(60,70,50,.08);
          transition:transform .12s; }
  a.item:active{ transform:scale(.98); }
  .date{ font-size:11px; color:var(--sub); }
  .ttl{ font-size:16.5px; font-weight:bold; color:var(--accent); margin:2px 0; }
  .desc{ font-size:12.5px; color:var(--sub); }
  footer{ text-align:center; margin-top:30px; font-size:10.5px; color:#a8ad9c; line-height:1.9; }
</style>
</head>
<body>
<header>
  <h1><small>HELMETTO NEWS SHELF</small>📰 単発ニュースの棚</h1>
  <div id="lead">その時々でお届けした単発ニュースの保管棚です。<br>新しいものが上に並びます。</div>
</header>
<div id="list">
  <!-- ▼ 新しいニュースはこの行の直後に追加（新しいものが上） ▼ -->
  <a class="item" href="catseye.html">
    <div class="date">2026-09-04</div>
    <div class="ttl">🐈‍⬛ スナック キャッツアイさんへ</div>
    <div class="desc">夜の路地にともる灯りと黒猫。行きつけのお店への描き下ろしイラスト3枚</div>
  </a>
  <a class="item" href="yakiniku-bui.html">
    <div class="date">2026-09-04</div>
    <div class="ttl">🍖 焼肉の部位ずかん</div>
    <div class="desc">かわいい牛の絵をタップすると、部位の食感・味わい・焼き方がわかる一枚もの</div>
  </a>
  <a class="item" href="https://helmetto2-prog.github.io/sankyonews/">
    <div class="date">2026-07-31</div>
    <div class="ttl">三共さま向け 業界ニュース</div>
    <div class="desc">スマホコード発・初の単発ニュース（別リポジトリ sankyonews に掲載）</div>
  </a>
</div>
<footer>つくったひと: まとん（Claude）／ずんだゲームズ・ニュース部</footer>
</body>
</html>
