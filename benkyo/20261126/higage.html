<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>庭の日かげ番</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:#17301f; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
         min-height:100vh; font-family:'Segoe UI','Hiragino Sans','Yu Gothic UI','MS PGothic',sans-serif;
         touch-action:manipulation; user-select:none; -webkit-user-select:none; overflow:hidden; }
  canvas { display:block; width:min(100vw, calc((100dvh - 190px) * 0.75)); height:auto; border-radius:10px;
           box-shadow:0 0 30px rgba(160,220,140,0.25); margin-top:4px; }
  #pad { width:min(100vw, 460px); display:grid; grid-template-columns:1fr 1fr 1fr 1.25fr; grid-template-rows:50px 50px 50px;
         gap:5px; padding:6px 10px 4px; }
  #pad button { font:bold 20px 'Segoe UI','Yu Gothic UI',sans-serif; border:0; border-radius:12px; background:#2f5a3a; color:#f4ffe8;
         touch-action:manipulation; }
  #pad button:active { background:#4d8a5c; }
  #pad .sub { background:#3a4a57; font-size:14px; }
  #pad .wait { background:#7a5a2a; font-size:16px; }
  #bU{grid-column:2;grid-row:1} #bL{grid-column:1;grid-row:2} #bW{grid-column:2;grid-row:2} #bR{grid-column:3;grid-row:2}
  #bD{grid-column:2;grid-row:3} #bZ{grid-column:4;grid-row:1} #bRe{grid-column:4;grid-row:2} #bM{grid-column:4;grid-row:3}
  #bS{grid-column:1;grid-row:1} #bN{grid-column:3;grid-row:1}
</style>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<div id="pad">
  <button id="bS" class="sub">庭えらび</button>
  <button id="bU">▲</button>
  <button id="bN" class="sub">つぎへ</button>
  <button id="bZ" class="sub">1手もどす</button>
  <button id="bL">◀</button>
  <button id="bW" class="wait">待つ</button>
  <button id="bR">▶</button>
  <button id="bRe" class="sub">やり直す</button>
  <button id="bD">▼</button>
  <button id="bM" class="sub">🔊 音</button>
</div>
<audio id="bgm" preload="none"></audio>
<script>
'use strict';
/* ========================= ENGINE（土台。ほぼ共通） ========================= */
const C = document.getElementById('c'), ctx = C.getContext('2d');
const W = C.width, H = C.height;
const clock = () => performance.now();
const clamp = (v,a,b) => v<a?a:v>b?b:v;
let state = 'title';                 // 'title'|'play'|'over'
let G = null;

const SFX = (function(){
  let ac=null, master=null, on=true;
  const midi = n => 440*Math.pow(2,(n-69)/12);
  function tone(f,d,type,v){ if(!ac) return; const t=ac.currentTime+0.01, o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0006,t+d); o.connect(g).connect(master); o.start(t); o.stop(t+d+0.03); }
  return {
    get on(){ return on; }, set on(v){ on=v; if(master) master.gain.value=on?0.2:0; },
    ensure(){ try{ if(!ac){ const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
      ac=new A(); master=ac.createGain(); master.gain.value=on?0.2:0; master.connect(ac.destination); }
      if(ac.state==='suspended') ac.resume(); }catch(e){} },
    move(){ tone(300,0.05,'triangle',0.08); },
    bump(){ tone(120,0.08,'square',0.05); },
    wait(){ tone(220,0.08,'sine',0.06); },
    hot(n){ tone(500+n*120,0.09,'square',0.05); },
    fill(){ [72,76,79].forEach((m,i)=>setTimeout(()=>tone(midi(m),0.12,'sine',0.12), i*70)); },
    water(){ [79,84,88,91].forEach((m,i)=>setTimeout(()=>tone(midi(m),0.16,'triangle',0.11), i*80)); },
    push(){ tone(180,0.1,'sawtooth',0.05); },
    win(){ [60,64,67,72,76].forEach((m,i)=>setTimeout(()=>tone(midi(m),0.25,'triangle',0.13), i*120)); },
    lose(){ [67,63,60,55].forEach((m,i)=>setTimeout(()=>tone(midi(m),0.25,'sine',0.12), i*150)); },
  };
})();

const FX = (function(){
  let parts=[], shake=0;
  return {
    burst(x,y,col,count){ count=count||8; for(let i=0;i<count;i++){ const a=Math.random()*6.2832, s=1+Math.random()*3;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,col:col||'#fff',life:0,dur:0.5+Math.random()*0.4}); } },
    shake(amt){ shake=Math.max(shake,amt); },
    update(dt){ const f=dt/16; for(const p of parts){ p.life+=dt/1000; p.x+=p.vx*f; p.y+=p.vy*f; p.vy+=0.25*f; }
      parts=parts.filter(p=>p.life<p.dur); shake=Math.max(0,shake-dt/16); },
    preDraw(){ if(shake>0){ ctx.save(); ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); } },
    postDraw(){ if(shake>0) ctx.restore(); for(const p of parts){ ctx.save(); ctx.globalAlpha=Math.max(0,1-p.life/p.dur);
      ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,6.2832); ctx.fill(); ctx.restore(); } },
    clear(){ parts=[]; shake=0; },
  };
})();

const Store = {
  key: 'niwa_higage_v1',
  load(){ try{ return JSON.parse(localStorage.getItem(this.key)) || {}; }catch(e){ return {}; } },
  save(o){ try{ localStorage.setItem(this.key, JSON.stringify(o)); }catch(e){} },
};
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

let lastT=0;
function loop(t){ const dt = lastT ? Math.min(50, t-lastT) : 16; lastT=t;
  if (state==='play') update(dt);
  FX.update(dt); render(); requestAnimationFrame(loop); }

/* ============================== ==== GAME ==== ============================== */
/*CORE-BEGIN*/
// ---- 庭の日かげ番：ルールの芯（画面を使わない。node の確かめ道具と共用） ----
const COLS = 8, ROWS = 8, HEAT_MAX = 3, CAN = 2;
// 太陽の段：[名前, 影の向き dx, dy, 影の長さ]
const SUN = {
  A: ['朝',   -1, 0, 2],
  B: ['午前', -1, 0, 1],
  C: ['昼',    0,-1, 1],
  D: ['午後',  1, 0, 1],
  E: ['夕方',  1, 0, 2],
};
const MOVES = { U:[0,-1], D:[0,1], L:[-1,0], R:[1,0], W:[0,0] };
function parseLevel(L){
  if (L._p) return L._p;
  const g = [], flowers = [], par = []; let sx = 0, sy = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
    let c = L.map[y][x];
    if (c === 'P'){ sx = x; sy = y; c = '.'; }
    if (c === 'F'){ flowers.push(y*COLS+x); }
    if (c === 'U'){ par.push(y*COLS+x); c = '.'; }
    g.push(c);
  }
  L._p = { g, flowers, par, sx, sy, limit: L.per * L.sun.length };
  return L._p;
}
function initState(L){ const p = parseLevel(L);
  const S = { x:p.sx, y:p.sy, heat:0, t:0, water:0, done:0, par:p.par.slice(), fail:'', win:false };
  return S; }
function phaseAt(L, t){ const i = Math.min(L.sun.length-1, Math.floor(t / L.per)); return SUN[L.sun[i]]; }
function shadeAt(L, par, t){
  const p = parseLevel(L), ph = phaseAt(L, t), sh = new Uint8Array(COLS*ROWS);
  const cast = (x, y) => { for (let i = 1; i <= ph[3]; i++){ const nx = x+ph[1]*i, ny = y+ph[2]*i;
    if (nx>=0 && ny>=0 && nx<COLS && ny<ROWS) sh[ny*COLS+nx] = 1; } };
  for (let i = 0; i < p.g.length; i++){ const c = p.g[i];
    if (c === '#') cast(i%COLS, i/COLS|0);
    if (c === 'R') sh[i] = 1; }
  for (const i of par) cast(i%COLS, i/COLS|0);
  return sh;
}
// 1手すすめる。動けない時は null。S は書きかえず新しい状態を返す
function stepState(L, S, a){
  const p = parseLevel(L), d = MOVES[a]; if (!d || S.fail || S.win) return null;
  let nx = S.x + d[0], ny = S.y + d[1], par = S.par;
  if (a !== 'W'){
    if (nx<0 || ny<0 || nx>=COLS || ny>=ROWS) return null;
    const ni = ny*COLS+nx, c = p.g[ni];
    if (c === '#' || c === '~') return null;
    const k = par.indexOf(ni);
    if (k >= 0){ // パラソルを押す
      const bx = nx+d[0], by = ny+d[1]; if (bx<0 || by<0 || bx>=COLS || by>=ROWS) return null;
      const bi = by*COLS+bx; if (p.g[bi] !== '.' || par.indexOf(bi) >= 0) return null;
      par = par.slice(); par[k] = bi;
    }
  }
  const N = { x:nx, y:ny, heat:S.heat, t:S.t+1, water:S.water, done:S.done, par, fail:'', win:false, ev:'' };
  const i = ny*COLS+nx, c = p.g[i];
  if (c === 'T' && N.water < CAN){ N.water = CAN; N.ev = 'fill'; }
  if (c === 'F'){ const b = 1 << p.flowers.indexOf(i);
    if (!(N.done & b) && N.water > 0){ N.done |= b; N.water--; N.ev = 'water'; } }
  const sh = shadeAt(L, par, N.t);
  if (sh[i]) N.heat = 0; else N.heat++;
  if (N.done === (1 << p.flowers.length) - 1) N.win = true;
  else if (N.heat >= HEAT_MAX) N.fail = 'heat';
  else if (N.t >= p.limit) N.fail = 'dusk';
  return N;
}
/*CORE-END*/

// ---- 面（どれも総当たりで解ける事を確かめた。min＝いちばん少ない手数） ----
const LEVELS = [
  { name:'はじめての水やり', per:6, sun:['A','C','E'], min:15,
    map:['....#...','.....#..','...#....','P...#...','.......T','.......F','...#....','........'],
    memo:'木の影は、朝は西へ長く、昼は北へ短く、夕方は東へ長くのびるよ。' },
  { name:'ふたつの花', per:6, sun:['A','B','C','D'], min:19,
    map:['~.....P.','........','...T..#.','....##.F','~.......','....F...','....#...','...#..#.'],
    memo:'東屋（あずまや）の下は、一日じゅう日かげ。ひと休みにちょうどいいよ。' },
  { name:'東屋のある庭', per:6, sun:['A','B','C','D','E'], min:20,
    map:['........','...#...#','....R.#~','.#...TF.','........','P.....#.','.~....F.','.......~'],
    memo:'パラソルは押して動かせるよ。影のない所に、自分で日かげを作ろう。' },
  { name:'パラソルを運ぶ', per:6, sun:['A','B','C','D','E'], min:26,
    map:['..~.....','........','...U.#..','~.~.##..','#..T.F..','........','...P....','..F.....'],
    memo:'じょうろの水は2回ぶん。花が3つある庭は、蛇口にもどる道も考えてね。' },
  { name:'夏の大きな庭', per:7, sun:['A','B','C','D','E'], min:26,
    map:['...F..#.','...#T.F.','........','..~..~..','...#.F~.','.U......','.R.#..~.','....P#..'],
    memo:'全部の庭に水が届いたよ。おつかれさま！' },
];
const TS = 52, OX = 32, OY = 118;
const BGM_LIST = ['bgm/01_Petals_on_the_Basin.mp3','bgm/09_Koi_Pond_Solitude.mp3','bgm/02_Moss_and_Bamboo.mp3'];
let save = Store.load();           // { best:{0:手数,...}, mute:bool }
if (!save.best) save.best = {};
SFX.on = !save.mute;

// ---- BGM（Gemini で作った歌なしの曲。最初の操作のあとに流す） ----
const bgm = document.getElementById('bgm'); let bgmI = 0, bgmStarted = false;
bgm.volume = 0.35;
bgm.addEventListener('ended', () => { bgmI = (bgmI+1) % BGM_LIST.length; bgm.src = BGM_LIST[bgmI]; bgm.play().catch(()=>{}); });
function bgmKick(){ if (save.mute) return; if (!bgmStarted){ bgmStarted = true; bgm.src = BGM_LIST[bgmI]; }
  if (bgm.paused) bgm.play().catch(()=>{ bgmStarted = false; }); }
function setMute(m){ save.mute = m; Store.save(save); SFX.on = !m; if (m) bgm.pause(); else bgmKick();
  document.getElementById('bM').textContent = m ? '🔇 音' : '🔊 音'; }
document.getElementById('bM').textContent = save.mute ? '🔇 音' : '🔊 音';

// ---- New game ----
function unlocked(){ let n = 0; while (n < LEVELS.length-1 && save.best[n] != null) n++; return n; }
function startLevel(li){
  const L = LEVELS[li];
  G = { li, L, S: initState(L), hist: [], anim: 0, px: 0, py: 0, msg: '', result: '', stars: 0 };
  G.px = G.S.x; G.py = G.S.y; FX.clear(); state = 'play';
  G.msg = li === 0 ? '蛇口で水をくんで、花に届けよう。日なたは続けて2歩まで。' : '';
}
function update(dt){ // 見た目の位置をなめらかに
  G.px += (G.S.x - G.px) * Math.min(1, dt/70); G.py += (G.S.y - G.py) * Math.min(1, dt/70); G.anim += dt; }

function act(a){
  if (state !== 'play') return;
  const N = stepState(G.L, G.S, a);
  if (!N){ SFX.bump(); FX.shake(3); return; }
  const pushed = N.par !== G.S.par;
  G.hist.push(G.S); G.S = N; G.msg = '';
  const cx = OX + N.x*TS + TS/2, cy = OY + N.y*TS + TS/2;
  if (N.ev === 'fill'){ SFX.fill(); FX.burst(cx,cy,'#7fd4ff',10); G.msg = 'じょうろに水をくんだ（2回ぶん）'; }
  else if (N.ev === 'water'){ SFX.water(); FX.burst(cx,cy,'#ff9ecb',16); FX.burst(cx,cy,'#7fd4ff',8); }
  else if (pushed) SFX.push(); else if (a === 'W') SFX.wait(); else SFX.move();
  if (N.heat > 0 && !N.win){ SFX.hot(N.heat); if (N.heat === 2) G.msg = 'あつい！ 次の1歩は日かげへ。'; }
  if (N.win){ state = 'over'; G.result = 'win'; SFX.win(); FX.shake(6);
    for (let i = 0; i < 5; i++) FX.burst(60+Math.random()*360, 200+Math.random()*300, ['#ffe27a','#ff9ecb','#9fe8a0'][i%3], 14);
    const mv = N.t, b = save.best[G.li]; if (b == null || mv < b){ save.best[G.li] = mv; Store.save(save); }
    G.stars = mv <= G.L.min + 2 ? 3 : mv <= G.L.min + 5 ? 2 : 1; }
  else if (N.fail){ state = 'over'; G.result = N.fail; SFX.lose(); FX.shake(8); }
}
function undo(){ if (!G || !G.hist.length) return; G.S = G.hist.pop(); state = 'play'; G.result = ''; G.msg = '1手もどした'; SFX.wait(); }
function retry(){ if (G) startLevel(G.li); }
function next(){ if (G && G.result === 'win'){ if (G.li < LEVELS.length-1) startLevel(G.li+1); else { state = 'title'; } } }

// ---- Render ----
function render(){
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#24492f'); g.addColorStop(1,'#16301e');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  if (state === 'title'){ renderTitle(); return; }
  const L = G.L, S = G.S, P = parseLevel(L), ph = phaseAt(L, S.t), sh = shadeAt(L, S.par, S.t);
  // --- 上の帯：庭の名前・太陽・暑さ・水 ---
  ctx.textAlign = 'left'; ctx.fillStyle = '#f4ffe8'; ctx.font = 'bold 19px "Segoe UI","Yu Gothic UI"';
  ctx.fillText('第' + (G.li+1) + 'の庭　' + L.name, 16, 26);
  // 太陽の道すじ（残りの手数）
  const bx = 16, bw = W-32, by = 40, n = L.sun.length;
  for (let i = 0; i < n; i++){ const x0 = bx + bw*i/n, cur = Math.min(n-1, Math.floor(S.t / L.per)) === i;
    ctx.fillStyle = cur ? '#ffd75a' : 'rgba(255,255,255,0.12)'; rrect(x0+1, by, bw/n-2, 22, 6); ctx.fill();
    ctx.fillStyle = cur ? '#4a3200' : '#cfe3c8'; ctx.font = 'bold 13px "Segoe UI","Yu Gothic UI"'; ctx.textAlign = 'center';
    const s = SUN[L.sun[i]]; ctx.fillText(s[0] + ' ' + (s[1]<0?'←':s[1]>0?'→':'↑') + s[3], x0 + bw/n/2, by+16); }
  for (let k = 0; k < P.limit; k++){ const x = bx + bw*(k+0.5)/P.limit;
    ctx.fillStyle = k < S.t ? 'rgba(255,255,255,0.18)' : (k === S.t ? '#ffd75a' : '#e9f6df');
    ctx.beginPath(); ctx.arc(x, by+33, k === S.t ? 4.5 : 2.4, 0, 6.2832); ctx.fill(); }
  ctx.textAlign = 'left'; ctx.font = 'bold 15px "Segoe UI","Yu Gothic UI"'; ctx.fillStyle = '#f4ffe8';
  ctx.fillText('のこり ' + (P.limit - S.t) + ' 手', 16, 104);
  // 暑さ
  ctx.fillText('暑さ', 150, 104);
  for (let i = 0; i < HEAT_MAX; i++){ ctx.fillStyle = i < S.heat ? ['#ffd24a','#ff9438','#ff4b3a'][i] : 'rgba(255,255,255,0.15)';
    rrect(190 + i*26, 90, 22, 17, 5); ctx.fill(); }
  // 水
  ctx.fillStyle = '#f4ffe8'; ctx.fillText('じょうろ', 290, 104);
  for (let i = 0; i < CAN; i++){ ctx.fillStyle = i < S.water ? '#62c6ff' : 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.arc(368 + i*24, 98, 9, 0, 6.2832); ctx.fill(); }
  ctx.fillStyle = '#f4ffe8'; ctx.fillText('花 ' + bits(S.done) + '/' + P.flowers.length, 420, 104);

  // --- 庭 ---
  FX.preDraw();
  // 次の手で太陽の段が変わるなら、次の影を先に見せる
  const nextPh = phaseAt(L, S.t+1), willChange = nextPh !== ph && S.t+1 < P.limit;
  const shNext = willChange ? shadeAt(L, S.par, S.t+1) : null;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
    const i = y*COLS+x, c = P.g[i], X = OX+x*TS, Y = OY+y*TS;
    ctx.fillStyle = (x+y)%2 ? '#b9dd6c' : '#c4e577'; ctx.fillRect(X,Y,TS,TS);
    if (c === '~'){ ctx.fillStyle = '#4aa6d8'; rrect(X+3,Y+3,TS-6,TS-6,14); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; const w = Math.sin(G.anim/500 + x)*3;
      ctx.beginPath(); ctx.moveTo(X+14,Y+22+w); ctx.quadraticCurveTo(X+26,Y+16+w,X+38,Y+22+w); ctx.stroke(); }
    if (sh[i]){ ctx.fillStyle = 'rgba(20,60,70,0.42)'; ctx.fillRect(X,Y,TS,TS); }
  }
  if (shNext){ ctx.strokeStyle = 'rgba(20,50,90,0.75)'; ctx.lineWidth = 2; ctx.setLineDash([5,4]);
    for (let i = 0; i < shNext.length; i++) if (shNext[i] && !sh[i]) ctx.strokeRect(OX+(i%COLS)*TS+4, OY+(i/COLS|0)*TS+4, TS-8, TS-8);
    ctx.setLineDash([]); }
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
    const i = y*COLS+x, c = P.g[i], X = OX+x*TS, Y = OY+y*TS, cx = X+TS/2, cy = Y+TS/2;
    if (c === '#'){ ctx.fillStyle = '#7a5230'; ctx.fillRect(cx-4, cy+4, 8, 18);
      ctx.fillStyle = '#2f7d3a'; ctx.beginPath(); ctx.arc(cx, cy-3, 19, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#48a052'; ctx.beginPath(); ctx.arc(cx-6, cy-9, 9, 0, 6.2832); ctx.fill(); }
    if (c === 'R'){ ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 4; ctx.strokeRect(X+5,Y+5,TS-10,TS-10);
      ctx.lineWidth = 2; for (let k = 1; k < 4; k++){ ctx.beginPath(); ctx.moveTo(X+5+k*10.5,Y+5); ctx.lineTo(X+5+k*10.5,Y+TS-5); ctx.stroke(); } }
    if (c === 'T'){ ctx.fillStyle = '#8d99a6'; ctx.fillRect(cx-3, cy-6, 6, 22); ctx.fillRect(cx-3, cy-12, 16, 6); ctx.fillRect(cx+9, cy-12, 5, 10);
      ctx.fillStyle = '#62c6ff'; const d = (G.anim/9)%16; ctx.beginPath(); ctx.arc(cx+11.5, cy+2+d, 3, 0, 6.2832); ctx.fill(); }
    if (c === 'F'){ const done = S.done & (1 << P.flowers.indexOf(i));
      ctx.strokeStyle = done ? '#2f8a3a' : '#8a8a4a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, cy+20);
      ctx.quadraticCurveTo(cx+(done?0:8), cy+6, cx+(done?0:10), cy-(done?4:-4)); ctx.stroke();
      const fx = cx+(done?0:10), fy = cy-(done?8:-4), r = done ? 7 : 4.5;
      ctx.fillStyle = done ? '#ff7fb5' : '#c9a66b';
      for (let k = 0; k < 5; k++){ const a = k*1.2566 + (done ? G.anim/1500 : 0); ctx.beginPath(); ctx.arc(fx+Math.cos(a)*r, fy+Math.sin(a)*r, r*0.75, 0, 6.2832); ctx.fill(); }
      ctx.fillStyle = done ? '#ffe27a' : '#8a6a3a'; ctx.beginPath(); ctx.arc(fx, fy, r*0.55, 0, 6.2832); ctx.fill();
      if (!done && S.water === 0 && (G.anim/600|0)%2 === 0){ ctx.fillStyle = '#62c6ff'; ctx.font = 'bold 13px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText('水…', cx-10, cy-12); } }
  }
  for (const i of S.par){ const cx = OX+(i%COLS)*TS+TS/2, cy = OY+(i/COLS|0)*TS+TS/2;
    ctx.fillStyle = '#6b4a2a'; ctx.fillRect(cx-2, cy, 4, 20);
    for (let k = 0; k < 8; k++){ ctx.fillStyle = k%2 ? '#ffffff' : '#e8533f'; ctx.beginPath(); ctx.moveTo(cx, cy-4);
      ctx.arc(cx, cy-4, 20, k*0.7854, (k+1)*0.7854); ctx.closePath(); ctx.fill(); } }
  // 水やりの子
  { const cx = OX+G.px*TS+TS/2, cy = OY+G.py*TS+TS/2, hot = S.heat, bob = Math.sin(G.anim/260)*1.5;
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(cx, cy+19, 13, 4, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#3f8fd0'; rrect(cx-9, cy-2+bob, 18, 19, 6); ctx.fill();
    ctx.fillStyle = hot >= 2 ? '#ff9c8a' : '#ffd9b3'; ctx.beginPath(); ctx.arc(cx, cy-9+bob, 9, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#f1d27a'; ctx.beginPath(); ctx.ellipse(cx, cy-14+bob, 15, 4.5, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy-15+bob, 8, 3.14, 0); ctx.fill();
    ctx.fillStyle = '#333'; ctx.fillRect(cx-4, cy-9+bob, 2, 2); ctx.fillRect(cx+2, cy-9+bob, 2, 2);
    ctx.fillStyle = S.water > 0 ? '#62c6ff' : '#9aa7b3'; rrect(cx+8, cy+2+bob, 10, 9, 2); ctx.fill(); ctx.fillRect(cx+17, cy+3+bob, 5, 2);
    if (hot > 0){ ctx.fillStyle = '#8fd8ff'; for (let k = 0; k < hot; k++){ ctx.beginPath(); ctx.arc(cx-13-k*3, cy-12+k*6+bob, 2.4, 0, 6.2832); ctx.fill(); } }
  }
  FX.postDraw();
  // --- 下の帯：ひとこと ---
  ctx.textAlign = 'center'; ctx.fillStyle = '#eaffd8'; ctx.font = '15px "Segoe UI","Yu Gothic UI"';
  const tip = G.msg || (shNext ? '点線＝次の1手で影が動く所' : '影の向きは上の帯のとおり（' + ph[0] + '）');
  ctx.fillText(tip, W/2, OY + ROWS*TS + 28);
  ctx.fillStyle = '#9fc79a'; ctx.font = '12px "Segoe UI","Yu Gothic UI"';
  ctx.fillText('最少 ' + L.min + ' 手' + (save.best[G.li] != null ? '　／　きろく ' + save.best[G.li] + ' 手' : '') + '　※暑さの数字はゲームの中の決まりです', W/2, OY + ROWS*TS + 52);

  if (state === 'over') renderOver();
}
function bits(n){ let c = 0; while (n){ c += n & 1; n >>= 1; } return c; }
function wrap(text, x, y, maxW, lh){ let line = ''; for (const ch of text){ if (ctx.measureText(line + ch).width > maxW){ ctx.fillText(line, x, y); y += lh; line = ch; } else line += ch; }
  ctx.fillText(line, x, y); return y; }
function renderOver(){
  ctx.fillStyle = 'rgba(8,24,14,0.78)'; ctx.fillRect(0,0,W,H); ctx.textAlign = 'center';
  if (G.result === 'win'){
    ctx.fillStyle = '#ffe27a'; ctx.font = 'bold 38px "Segoe UI","Yu Gothic UI"'; ctx.fillText('水が届いた！', W/2, 210);
    ctx.font = '40px "Segoe UI"'; ctx.fillText('★'.repeat(G.stars) + '☆'.repeat(3-G.stars), W/2, 268);
    ctx.fillStyle = '#eaffd8'; ctx.font = '17px "Segoe UI","Yu Gothic UI"';
    ctx.fillText(G.S.t + ' 手（最少 ' + G.L.min + ' 手）', W/2, 304);
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; rrect(40, 330, W-80, 110, 12); ctx.fill();
    ctx.fillStyle = '#ffd75a'; ctx.font = 'bold 14px "Segoe UI","Yu Gothic UI"'; ctx.fillText('📒 庭のメモ', W/2, 356);
    ctx.fillStyle = '#f4ffe8'; ctx.font = '16px "Segoe UI","Yu Gothic UI"'; wrap(G.L.memo, W/2, 384, W-120, 24);
    const blink = (clock()/500|0)%2 === 0; ctx.fillStyle = blink ? '#ffe27a' : '#8a9a80'; ctx.font = 'bold 20px "Segoe UI","Yu Gothic UI"';
    ctx.fillText(G.li < LEVELS.length-1 ? 'タップで つぎの庭へ' : 'タップで はじめの画面へ', W/2, 490);
  } else {
    ctx.fillStyle = '#ffb38a'; ctx.font = 'bold 34px "Segoe UI","Yu Gothic UI"';
    ctx.fillText(G.result === 'heat' ? 'ばててしまった…' : '日が暮れてしまった…', W/2, 250);
    ctx.fillStyle = '#eaffd8'; ctx.font = '16px "Segoe UI","Yu Gothic UI"';
    ctx.fillText(G.result === 'heat' ? '日なたは続けて2歩まで。日かげで休めば元気がもどるよ。' : '太陽が沈む前に、ぜんぶの花に水を。', W/2, 292);
    ctx.fillStyle = '#ffe27a'; ctx.font = 'bold 20px "Segoe UI","Yu Gothic UI"';
    ctx.fillText('タップで やり直す　／「1手もどす」も使えるよ', W/2, 360);
  }
}
let selMode = false;
function renderTitle(){
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd75a'; ctx.beginPath(); ctx.arc(W/2+120, 96, 34, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#2f7d3a'; ctx.beginPath(); ctx.arc(W/2-130, 120, 44, 0, 6.2832); ctx.fill();
  ctx.fillStyle = 'rgba(20,60,70,0.42)'; ctx.beginPath(); ctx.ellipse(W/2-60, 170, 70, 12, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#f4ffe8'; ctx.font = 'bold 44px "Segoe UI","Yu Gothic UI"'; ctx.fillText('庭の日かげ番', W/2, 236);
  ctx.font = '15px "Segoe UI","Yu Gothic UI"'; ctx.fillStyle = '#d6efca';
  if (!selMode){
    ['蛇口で水をくんで、しおれた花に届けよう。','日なたは続けて2歩まで。木の影は太陽といっしょに動く。','太陽が沈む（手数が尽きる）前に、ぜんぶの花へ。']
      .forEach((t,i) => ctx.fillText(t, W/2, 290+i*27));
    ctx.fillStyle = '#9fc79a'; ctx.font = '13px "Segoe UI","Yu Gothic UI"';
    ctx.fillText('PC：矢印キー＝移動　スペース＝待つ　Z＝1手もどす　R＝やり直す', W/2, 392);
    const blink = (clock()/500|0)%2 === 0; ctx.fillStyle = blink ? '#ffe27a' : '#8a9a80'; ctx.font = 'bold 24px "Segoe UI","Yu Gothic UI"';
    ctx.fillText('タップ / スペースで はじめる', W/2, 470);
    ctx.fillStyle = '#9fc79a'; ctx.font = '12px "Segoe UI","Yu Gothic UI"';
    ctx.fillText('曲：Gemini（音楽を作成）で作った歌なしの3曲　／　※暑さの数字はゲームの中の決まりです', W/2, 610);
  } else {
    ctx.fillText('遊ぶ庭をえらぶ', W/2, 280); const un = unlocked();
    LEVELS.forEach((L,i) => { const y = 300 + i*58, ok = i <= un;
      ctx.fillStyle = ok ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.05)'; rrect(50, y, W-100, 48, 10); ctx.fill();
      ctx.fillStyle = ok ? '#f4ffe8' : '#6f8a72'; ctx.font = 'bold 17px "Segoe UI","Yu Gothic UI"'; ctx.textAlign = 'left';
      ctx.fillText((ok ? '' : '🔒 ') + '第' + (i+1) + 'の庭　' + L.name, 66, y+30);
      ctx.textAlign = 'right'; ctx.font = '13px "Segoe UI","Yu Gothic UI"';
      ctx.fillText(save.best[i] != null ? 'きろく ' + save.best[i] + ' 手' : '', W-66, y+30); ctx.textAlign = 'center'; });
  }
}

// ---- Input ----
function begin(){ SFX.ensure(); bgmKick(); }
function tapAt(mx, my){
  begin();
  if (state === 'title'){
    if (selMode){ const i = Math.floor((my-300)/58); if (i >= 0 && i < LEVELS.length && i <= unlocked() && mx > 50 && mx < W-50){ selMode = false; startLevel(i); } else selMode = false; return; }
    startLevel(unlocked() < LEVELS.length && save.best[LEVELS.length-1] == null ? unlocked() : 0); return; }
  if (state === 'over'){ if (G.result === 'win') next(); else retry(); return; }
  const cx = Math.floor((mx-OX)/TS), cy = Math.floor((my-OY)/TS); if (cx<0||cy<0||cx>=COLS||cy>=ROWS) return;
  const dx = cx-G.S.x, dy = cy-G.S.y;
  if (dx === 0 && dy === 0) act('W'); else if (Math.abs(dx) >= Math.abs(dy)) act(dx>0?'R':'L'); else act(dy>0?'D':'U');
}
C.addEventListener('pointerdown', e => { e.preventDefault(); const r = C.getBoundingClientRect();
  tapAt((e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height); });
const BTN = { bU:()=>act('U'), bD:()=>act('D'), bL:()=>act('L'), bR:()=>act('R'), bW:()=>act('W'), bZ:undo, bRe:retry,
  bM:()=>setMute(!save.mute), bS:()=>{ state = 'title'; selMode = true; }, bN:()=>{ if (state==='over' && G.result==='win') next(); } };
for (const id in BTN) document.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); begin();
  if (state === 'title' && 'bUbDbLbRbW'.includes(id)){ tapAt(-1,-1); return; }
  if (state === 'over' && 'bUbDbLbRbW'.includes(id)){ return; }
  BTN[id](); });
document.addEventListener('keydown', e => {
  const k = e.code; if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(k)) e.preventDefault();
  if (e.repeat && !k.startsWith('Arrow')) return; begin();
  if (k === 'KeyM'){ setMute(!save.mute); return; }
  if (state === 'title'){ if (k === 'Space' || k === 'Enter'){ selMode = false; tapAt(-1,-1); } return; }
  if (k === 'KeyZ'){ undo(); return; } if (k === 'KeyR'){ retry(); return; }
  if (state === 'over'){ if (k === 'Space' || k === 'Enter'){ if (G.result === 'win') next(); else retry(); } return; }
  const m = { ArrowLeft:'L', KeyA:'L', ArrowRight:'R', KeyD:'R', ArrowUp:'U', KeyW:'U', ArrowDown:'D', KeyS:'D', Space:'W' }[k];
  if (m) act(m);
});
document.addEventListener('contextmenu', e => e.preventDefault());

state = 'title';
requestAnimationFrame(loop);
</script>
