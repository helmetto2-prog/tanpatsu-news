<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>竹中さんのアプリ</title>
<meta name="theme-color" content="#2f5d34">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="竹中さんのアプリ">
<!-- 竹中さん（MKJ）のアプリ（まとん作・2026-11-18 v01）。義樹さんの専務アプリと同じ見た目の入口。
     中身はゲームだけ（タイトル画面の絵つき）。会社の物（日報など）はここには入れていない。目次に載せない・noindex。 -->
<style>
:root{--green:#2f5d34;--green2:#3f7a45;--bg:#f3f0e6;--line:#d9d3bd;--ink:#22301f;--sub:#5d6b58;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;}
header{background:var(--green);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 16px;display:flex;align-items:center;gap:14px;}
header img{width:64px;height:64px;border-radius:16px;flex:none;box-shadow:0 3px 10px rgba(0,0,0,.3);}
header h1{font-size:1.35rem;font-weight:900;letter-spacing:.04em;line-height:1.3;}
header p{font-size:.82rem;opacity:.9;margin-top:3px;}
main{max-width:720px;margin:0 auto;padding:6px 14px 20px;}
.sec{display:flex;align-items:center;gap:12px;margin:22px 0 12px;}
.sec span{background:var(--green);color:#fff;font-weight:900;font-size:1.05rem;padding:8px 18px;border-radius:10px 10px 10px 0;flex:none;}
.sec::after{content:"";flex:1;height:2px;background:var(--line);}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
a.g{display:block;background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:transform .08s;}
a.g:active{transform:scale(.97);border-color:var(--green2);}
a.g .pic{position:relative;aspect-ratio:4/3;background:#16241a;}
a.g .pic img{width:100%;height:100%;object-fit:cover;display:block;}
a.g .tag{position:absolute;left:6px;bottom:6px;background:rgba(20,30,20,.82);color:#fff;font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:999px;}
a.g .tx{padding:9px 10px 11px;}
a.g b{display:block;font-size:1rem;font-weight:900;line-height:1.35;}
a.g small{display:block;font-size:.76rem;color:var(--sub);line-height:1.5;margin-top:3px;}
/* v02：しごと・よみものの段（専務アプリと同じ横長のカード）と、設定の歯車 */
.rows{display:grid;gap:12px;}
a.r{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;color:inherit;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.05);}
a.r:active{transform:scale(.98);border-color:var(--green2);}
a.r i{flex:none;width:58px;height:58px;border-radius:14px;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:30px;font-style:normal;}
a.r b{display:block;font-size:1.15rem;font-weight:900;line-height:1.35;}
a.r small{display:block;font-size:.82rem;color:var(--sub);line-height:1.5;margin-top:2px;}
#gear{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:rgba(63,122,69,.82);color:#fff;font-size:26px;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:9;}
#set{position:fixed;inset:0;z-index:20;background:rgba(20,30,20,.55);display:none;align-items:flex-end;justify-content:center;}
#set.on{display:flex;}
#set .box{background:#fff;width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;}
#set h2{font-size:1.1rem;font-weight:900;margin-bottom:6px;}
#set p{font-size:.85rem;line-height:1.7;color:var(--sub);margin:6px 0;}
#set textarea{width:100%;min-height:84px;font-size:.9rem;padding:10px;border:2px solid var(--line);border-radius:12px;font-family:inherit;margin-top:6px;}
#set .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
#set button{min-height:48px;border:0;border-radius:12px;font-size:.95rem;font-weight:900;font-family:inherit;background:var(--green);color:#fff;}
#set button.sub{background:#e9e5d6;color:var(--ink);}
#set button.wide{grid-column:1 / -1;}
#set .msg{font-size:.85rem;font-weight:700;color:#8a5a00;min-height:1.4em;margin-top:8px;}
.memo{margin-top:22px;padding:12px 14px;border-radius:14px;background:#fff;border:2px dashed var(--line);font-size:.82rem;line-height:1.75;color:var(--sub);}
.memo b{color:var(--ink);}
footer{text-align:center;color:var(--sub);font-size:.95rem;padding:10px 0 calc(22px + env(safe-area-inset-bottom));}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <div>
    <h1>竹中さんのアプリ</h1>
    <p>カレンダー・よみもの・ゲームの入口です</p>
  </div>
</header>
<main id="main"></main>
<footer>🌲 みどり造園</footer>
<button type="button" id="gear" aria-label="設定">⚙</button>
<div id="set"><div class="box">
  <h2>協力者カレンダーのアドレス</h2>
  <p>カレンダーのアドレスは、このスマホの中だけに覚えます（ページには書いてありません）。アドレスを貼って「覚える」を押してください。</p>
  <textarea id="calIn" placeholder="https://script.google.com/macros/… を貼る" inputmode="url" autocapitalize="off" spellcheck="false"></textarea>
  <div class="btns">
    <button type="button" id="calSave" class="wide">覚える</button>
    <button type="button" id="calShare" class="sub">渡す用のアドレスを写す</button>
    <button type="button" id="calClear" class="sub">忘れる</button>
    <button type="button" id="setClose" class="sub wide">とじる</button>
  </div>
  <div class="msg" id="setMsg"></div>
  <p>「渡す用のアドレスを写す」＝覚えたアドレスを中に包んだ、このアプリのアドレスを写します。それを相手に送ると、開いただけでカレンダーのボタンが使えるようになります。</p>
</div></div>

<script>
// ===== ゲームの一覧（足す時はここに1行。絵は shots\<id>.jpg） =====
const S = "https://helmetto2-prog.github.io";
const LIST = [
  ["かるく遊ぶ", [
    ["flower-pop", "フラワーポップ", "花を4つつなげて消す落ち物パズル", S + "/midori-games/flower-pop/"],
    ["hakooshi", "はこおし", "箱を押してしまう倉庫パズル・全30面", S + "/hakooshi/"],
    ["nashimuki", "なしむきパズル 3D", "なしの皮を切らさずにむく", S + "/nashimuki-puzzle/"],
    ["tsumikomi", "積み込みチャレンジ", "トラックに道具をうまく積む", S + "/tsumikomi-challenge/"],
    ["survivor", "ネオ・サバイバー", "10分間、敵の群れを生きのびる", S + "/midori-games/survivor/"],
    ["gundan-cannon", "軍団カノン", "大砲から兵隊を撃ち出して増やす", S + "/midori-games/gundan-cannon/"],
    ["midorius", "ミドリウス", "横スクロールのシューティング", S + "/midorius/"],
    ["kungfu-garden", "カンフーガーデン", "拳法で城をのぼる横スクロール", S + "/midori-games/kungfu-garden/"],
    ["uchiwa", "うちわ番長", "リズムに合わせてあおぐ", S + "/uchiwa-bancho/"],
    ["hanabi", "花火番長", "リズムに合わせて花火を上げる", S + "/hanabi-bancho/"],
    ["amida", "あみだ株レース", "あみだくじのレース", S + "/amida-kabu-race/"]
  ]],
  ["じっくり", [
    ["zorozoro", "ゾロゾロ大進軍", "仲間をふやして魔王をたおす", S + "/midori-games/zorozoro/"],
    ["midorikun", "みどりくんの大冒険", "入るたびに形が変わる地下迷宮", S + "/midorikun-daiboken/"],
    ["emerald", "エメラルドの迷宮", "仲間を集めて地下迷宮をすすむRPG", S + "/emerald-labyrinth/"],
    ["zouen", "造園立志伝", "造園会社の経営シミュレーション", S + "/midori-games/zouen-risshiden/"],
    ["sengoku", "戦国", "全国統一をめざす", S + "/midorisengoku/", "横向き"],
    ["kyoryu", "恐竜スタリオン", "恐竜を育ててレースへ", S + "/midori-games/kyoryu-stallion/", "横向き"],
    ["tsugu", "つぐのずんだ", "夕ぐれの町の物語", S + "/tsugu-no-zunda/"]
  ]],
  ["3D", [
    ["aquatoto", "アクア・トト 3D", "たんけん水族館を歩く", S + "/aquatoto-3d/"],
    ["toba", "鳥羽 3D", "海の水族館を歩く", S + "/aquatoto-3d/toba/"],
    ["shokubutsu-koen", "みどりの植物公園 3D", "木や花にタッチして図鑑をあつめる", S + "/shokubutsu-koen/"],
    ["neko", "ねこガーデン大作戦 3D", "ねこを出して敵の城をおとす", S + "/midorinyanko/", "横向き"],
    ["umiraku-en", "うみらく園ものがたり 3D", "お部屋から釣りができる海の宿", S + "/midori-games/umiraku-en/"],
    ["tsuri-bancho", "釣り番長", "潮を読んで大物をねらう", S + "/midori-games/tsuri-bancho/", "データ大きめ"],
    ["z-exit", "Z番出口", "異変を見つけたら引き返す地下道", S + "/midori-games/z-exit/", "データ大きめ"]
  ]]
];
// ================================================================
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// ===== v02：協力者カレンダー（アドレスはスマホの中だけ・Google の GAS のアドレスだけ受け付ける） =====
const CAL_KEY = "asobi_t4_cal";
const okCal = u => /^https:\/\/script\.google\.com\/(a\/macros\/[^\/\s]+|macros)\/s\/[\w-]+\/exec(\?[^\s#]*)?$/.test(u);
const getCal = () => { try { const u = localStorage.getItem(CAL_KEY) || ""; return okCal(u) ? u : ""; } catch (e) { return ""; } };
const setCal = u => { try { if (u) localStorage.setItem(CAL_KEY, u); else localStorage.removeItem(CAL_KEY); return true; } catch (e) { return false; } };
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64d = s => { try { return decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/")))); } catch (e) { return ""; } };
// 渡す用のアドレス（…/#c=…）で開いた時：中のアドレスを覚えて、# から後ろは消す
function takeHash() { const m = location.hash.match(/^#c=([\w-]+)$/); if (!m) return;
  const u = b64d(m[1]); if (okCal(u)) setCal(u);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
takeHash();
window.addEventListener("hashchange", () => { takeHash(); if (typeof calDraw === "function") calDraw(); });

let h = '<div class="sec"><span>しごと</span></div><div class="rows">' +
  '<a class="r" id="calBtn" href="#"><i>📅</i><div><b>協力者カレンダー</b><small id="calSub"></small></div></a></div>' +
  '<div class="sec"><span>よみもの</span></div><div class="rows">' +
  '<a class="r" href="' + S + '/tanpatsu-news/ky-app/"><i>📖</i><div><b>KY絵本</b><small>みどりくんの安全の絵本（毎朝あたらしい巻）</small></div></a>' +
  '<a class="r" href="' + S + '/zoennews/"><i>🌳</i><div><b>造園ニュース</b><small>造園屋デイリー情報（毎朝）</small></div></a></div>';
for (const [name, games] of LIST) {
  h += '<div class="sec"><span>' + esc(name) + '</span></div><div class="grid">';
  for (const [id, title, sub, url, tag] of games) {
    h += '<a class="g" href="' + esc(url) + '"><div class="pic"><img src="shots/' + esc(id) + '.jpg" alt="" loading="lazy">' +
      (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') + '</div><div class="tx"><b>' + esc(title) + '</b><small>' + esc(sub) + '</small></div></a>';
  }
  h += '</div>';
}
h += '<div class="memo"><b>ホーム画面に置くと、アプリのように開けます。</b><br>iPhone：下の「共有」→「ホーム画面に追加」／Android：右上の「︙」→「ホーム画面に追加」<br>ゲームから戻る時は、スマホの「戻る」で戻れます。音が出るゲームがあります。</div>';
document.getElementById("main").innerHTML = h;

// ===== v02：カレンダーのボタンと設定 =====
const $ = id => document.getElementById(id);
const say = t => { $("setMsg").textContent = t; };
function calDraw() { const u = getCal();
  $("calSub").textContent = u ? "予定を見る・日報を出す" : "まだアドレスがありません（押して入れる）";
  $("calBtn").setAttribute("href", u || "#"); }
function openSet() { $("calIn").value = getCal(); say(""); $("set").classList.add("on"); }
$("calBtn").addEventListener("click", e => { if (!getCal()) { e.preventDefault(); openSet(); } });
$("gear").addEventListener("click", openSet);
$("setClose").addEventListener("click", () => $("set").classList.remove("on"));
$("set").addEventListener("click", e => { if (e.target === $("set")) $("set").classList.remove("on"); });
$("calSave").addEventListener("click", () => { const u = $("calIn").value.trim();
  if (!okCal(u)) { say("Google のアプリのアドレス（https://script.google.com/…/exec）を貼ってください。"); return; }
  say(setCal(u) ? "覚えました。カレンダーのボタンが使えます。" : "このスマホでは覚えられませんでした。"); calDraw(); });
$("calClear").addEventListener("click", () => { setCal(""); $("calIn").value = ""; say("忘れました。"); calDraw(); });
$("calShare").addEventListener("click", async () => { const u = getCal();
  if (!u) { say("先にアドレスを貼って「覚える」を押してください。"); return; }
  const link = location.origin + location.pathname + "#c=" + b64e(u);
  try { await navigator.clipboard.writeText(link); say("渡す用のアドレスを写しました。LINE などに貼って送れます。"); }
  catch (e) { $("calIn").value = link; $("calIn").select(); say("上の欄に出しました。全部えらんで写してください。"); } });
calDraw();
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
</body>
</html>
