<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KY絵本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#5a8f3c">
<style>
  :root {
    --bg-color: #fdf8ec;
    --text-color: #4a3f2e;
    --btn-bg: #5a8f3c;
    --btn-text: #ffffff;
    --accent: #d0541e;
    --sub: #1e6fa8;
    --border: #e0d8c8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #1e1a15;
      --text-color: #e8e2d5;
      --btn-bg: #6fb04a;
      --btn-text: #1a1a1a;
      --accent: #e5713e;
      --sub: #459ce0;
      --border: #3a322a;
    }
  }
  body {
    font-family: sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 0;
    line-height: 1.5;
    word-break: break-word;
  }
  .app-container {
    max-width: 412px;
    margin: 0 auto;
    padding: 16px;
    box-sizing: border-box;
  }
  .page-view {
    display: none;
  }
  .page-view.active {
    display: block;
  }
  .btn {
    display: block;
    width: 100%;
    min-height: 64px;
    font-size: 22px;
    font-weight: bold;
    background-color: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 8px;
    margin-bottom: 16px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    box-sizing: border-box;
    line-height: 1.3;
  }
  .btn:active { opacity: 0.8; }
  .btn-sub { background-color: var(--sub); }
  .btn-accent { background-color: var(--accent); }
  .btn-outline {
    background-color: transparent;
    color: var(--text-color);
    border: 2px solid var(--text-color);
  }
  .cover-img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    margin-bottom: 16px;
    display: block;
  }
  .text-title { font-size: 28px; font-weight: bold; margin: 0 0 8px 0; line-height: 1.4; }
  .text-large { font-size: 22px; font-weight: bold; margin: 0 0 16px 0; }
  .text-normal { font-size: 18px; margin: 0 0 16px 0; }
  .text-small { font-size: 16px; opacity: 0.9; margin: 0; }
  
  .list-item {
    background: rgba(128, 128, 128, 0.1);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .list-item-title { font-size: 22px; font-weight: bold; margin: 0 0 8px 0; color: var(--text-color); }
  .list-item-themes { font-size: 16px; opacity: 0.8; margin-bottom: 12px; }
  
  .search-box { margin-bottom: 24px; }
  .search-input {
    width: 100%;
    font-size: 22px;
    padding: 12px;
    box-sizing: border-box;
    border: 2px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
    background: var(--bg-color);
    color: var(--text-color);
  }
  .search-keywords {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .chip {
    background-color: var(--sub);
    color: var(--btn-text);
    border: none;
    border-radius: 24px;
    padding: 12px 16px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
  }
  
  .speech-ui {
    background-color: rgba(128, 128, 128, 0.15);
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 24px;
    display: none;
  }
  .speech-ui.active { display: block; }
  .speech-text {
    font-size: 24px;
    font-weight: bold;
    margin: 16px 0;
    min-height: 4.5em;
  }
  .speech-controls {
    display: flex;
    gap: 8px;
  }
  .speech-controls .btn { margin-bottom: 0; min-height: 54px; font-size: 18px; }
  /* まとん直し：止まった知らせと、どこから聞くかのボタン */
  #speech-note { display: none; color: var(--accent); font-weight: bold; font-size: 20px; margin: 0 0 12px 0; }
  #speech-choice { display: none; margin-bottom: 8px; }

  .error-text { color: var(--accent); font-weight: bold; font-size: 22px; }
  .footer { margin-top: 32px; text-align: center; border-top: 1px solid var(--border); padding-top: 16px; }
  
  hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
</style>
</head>
<body>

<div class="app-container">
  <!-- ホーム画面 -->
  <div id="view-home" class="page-view active">
    <div id="home-today-info">
      <!-- 今日の巻の情報がここに入ります -->
      <p class="text-large">データを読みこんでいます...</p>
    </div>
    
    <div class="speech-ui" id="speech-ui">
      <div class="text-normal" id="speech-progress">準備中...</div>
      <div class="speech-text" id="speech-current-text"></div>
      <div id="speech-note"></div><!-- まとん直し -->
      <div id="speech-choice"><!-- まとん直し：前に聞いた所が残っている時 -->
        <button class="btn btn-sub" id="btn-speech-tsuzuki">前の続きから聞く</button>
        <button class="btn btn-outline" id="btn-speech-hajime">最初から聞く</button>
      </div>
      <div class="speech-controls">
        <button class="btn btn-accent" id="btn-speech-pause">一時停止</button>
        <button class="btn btn-sub" id="btn-speech-resume" style="display:none;">つづきから</button>
        <button class="btn btn-outline" id="btn-speech-stop">止める</button>
      </div>
    </div>
    <div id="speech-error" class="error-text" style="display:none; margin-bottom:16px;">
      この画面では読み上げができません。右上のメニューから Chrome で開いてください。
    </div>

    <button class="btn" id="btn-read-today">今日の絵本を読む</button>
    <button class="btn btn-sub" id="btn-start-speech">今日の絵本を音声で聞く</button>
    
    <hr>
    
    <button class="btn btn-outline" onclick="location.hash='#list'">以前の巻をさがす</button>
    <button class="btn btn-outline" onclick="location.hash='#search'">道具や作業でさがす</button>
    <button class="btn btn-outline" onclick="location.hash='#bangai'">番外編を見る</button>
    
    <hr>
    
    <button class="btn btn-sub" onclick="location.href='../ky-ehon-chui.html'">この絵本の読み方と注意</button>
    <button class="btn btn-sub" onclick="location.href='../ky-ehon-matome.html'">全巻のもくじ</button>
  </div>

  <!-- 一覧画面 -->
  <div id="view-list" class="page-view">
    <button class="btn btn-outline" onclick="history.back()">もどる</button>
    <h2 class="text-title">以前の巻</h2>
    <div id="list-container"></div>
    <button class="btn btn-outline" onclick="history.back()">もどる</button>
  </div>

  <!-- 検索画面 -->
  <div id="view-search" class="page-view">
    <button class="btn btn-outline" onclick="history.back()">もどる</button>
    <h2 class="text-title">道具や作業でさがす</h2>
    
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="言葉を入力...">
      <button class="btn" onclick="doSearch()">入力した言葉でさがす</button>
    </div>
    
    <div class="text-normal" style="font-weight:bold;">選んでさがす:</div>
    <div class="search-keywords">
      <button class="chip" onclick="doSearch('刈払機')">刈払機</button>
      <button class="chip" onclick="doSearch('脚立')">脚立</button>
      <button class="chip" onclick="doSearch('チェーンソー')">チェーンソー</button>
      <button class="chip" onclick="doSearch('ブロワー')">ブロワー</button>
      <button class="chip" onclick="doSearch('トリマー')">トリマー</button>
      <button class="chip" onclick="doSearch('高所作業車')">高所作業車</button>
      <button class="chip" onclick="doSearch('熱中症')">熱中症</button>
      <button class="chip" onclick="doSearch('ハチ')">ハチ</button>
      <button class="chip" onclick="doSearch('電線')">電線</button>
      <button class="chip" onclick="doSearch('車・運転')">車・運転</button>
      <button class="chip" onclick="doSearch('帰り際')">帰り際</button>
    </div>
    
    <div id="search-result-msg" class="text-large"></div>
    <div id="search-result-container"></div>
    
    <button class="btn btn-outline" onclick="history.back()">もどる</button>
  </div>

  <!-- 番外編画面 -->
  <div id="view-bangai" class="page-view">
    <button class="btn btn-outline" onclick="history.back()">もどる</button>
    <h2 class="text-title">番外編</h2>
    <div id="bangai-container"></div>
    <button class="btn btn-outline" onclick="history.back()">もどる</button>
  </div>

  <div class="footer">
    <p class="text-small" id="footer-updated"></p>
    <p class="text-small">つくった人：Gemini</p>
  </div>
</div>

<script>
let appData = null;

// 日付フォーマット (YYYY-MM-DD -> M月D日)
function formatDate(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  if (parts.length >= 3) {
    return parseInt(parts[1], 10) + '月' + parseInt(parts[2], 10) + '日';
  }
  return dateStr;
}

// データ読み込み
async function loadData() {
  try {
    const res = await fetch('kan.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('Network response was not ok');
    appData = await res.json();
    renderHome();
    renderFooter();
    if (location.hash === '#list' || location.hash === '#bangai') handleHashChange(); // まとん直し：一覧の画面で開いた時も、読みこんだ後に出す
  } catch (error) {
    document.getElementById('home-today-info').innerHTML = 
      `<h2 class="error-text">読みこめませんでした。電波のよい所で、もう一度ひらいてください</h2>`;
  }
}

// ホーム画面描画
function renderHome() {
  if (!appData || !appData.hon || appData.hon.length === 0) return;
  const todayHon = appData.hon[0];
  let html = '';
  if (todayHon.cover) {
    html += `<img src="${todayHon.cover}" class="cover-img" alt="">`;
  }
  html += `<h2 class="text-title">${todayHon.label} ${todayHon.title}</h2>`;
  html += `<p class="text-large">${formatDate(todayHon.date)}</p>`;
  document.getElementById('home-today-info').innerHTML = html;
  
  document.getElementById('btn-read-today').onclick = () => {
    location.href = todayHon.page;
  };
}

// フッター描画
function renderFooter() {
  if (!appData || !appData.updated) return;
  // "2026-11-07 05:26" -> "11月7日 5時26分"
  const m = appData.updated.match(/(\d+)-(\d+)-(\d+)\s+(\d+):(\d+)/);
  if (m) {
    document.getElementById('footer-updated').textContent = 
      `${parseInt(m[2])}月${parseInt(m[3])}日 ${parseInt(m[4])}時${parseInt(m[5])}分に更新`;
  }
}

// リストアイテム生成
function createListItem(item) {
  const div = document.createElement('div');
  div.className = 'list-item';
  
  let titleHtml = `<h3 class="list-item-title">${item.label} ${item.title} (${formatDate(item.date)})</h3>`;
  let themesHtml = item.themes ? `<div class="list-item-themes">${item.themes}</div>` : '';
  let btnHtml = `<button class="btn" onclick="location.href='${item.page}'">${item.label}を読む</button>`; // まとん直し：どの巻が開くか分かる名前に
  
  div.innerHTML = titleHtml + themesHtml + btnHtml;
  return div;
}

// 一覧画面描画
function renderList() {
  const container = document.getElementById('list-container');
  container.innerHTML = '';
  if (appData && appData.hon) {
    appData.hon.forEach(item => {
      container.appendChild(createListItem(item));
    });
  }
}

// 番外編画面描画
function renderBangai() {
  const container = document.getElementById('bangai-container');
  container.innerHTML = '';
  if (appData && appData.bangai) {
    // 番号の小さい順にソート
    const sorted = [...appData.bangai].sort((a, b) => a.no - b.no);
    sorted.forEach(item => {
      container.appendChild(createListItem(item));
    });
  }
}

// 検索処理
function doSearch(keyword = null) {
  const inputEl = document.getElementById('search-input');
  let query = keyword || inputEl.value;
  if (!query) return;
  
  inputEl.value = query; // 入力欄にも反映
  
  // 類義語の正規表現構築
  let searchPatternStr = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); // まとん直し：入れた字に記号があっても止まらないように
  if (['刈払機', '草刈り機', '刈払'].includes(query)) searchPatternStr = '刈払|草刈';
  if (['トリマー', '刈込機', '生垣'].includes(query)) searchPatternStr = 'トリマー|刈込|生垣';
  if (['熱中症', '暑さ', '水分'].includes(query)) searchPatternStr = '熱中症|暑さ|水分';
  if (['ハチ', '蜂'].includes(query)) searchPatternStr = 'ハチ|蜂';
  if (['車・運転', '運転', 'バック', '積み'].includes(query)) searchPatternStr = '車|運転|バック|積';
  if (['帰り際', '帰り', '帰る', '片付け'].includes(query)) searchPatternStr = '帰り|帰る|片付け';

  const regex = new RegExp(searchPatternStr, 'i');
  
  const results = [];
  if (appData && appData.hon) {
    appData.hon.forEach(item => {
      if (regex.test(item.title) || regex.test(item.themes)) {
        results.push(item);
      }
    });
  }
  
  const msgEl = document.getElementById('search-result-msg');
  const container = document.getElementById('search-result-container');
  container.innerHTML = '';
  
  if (results.length > 0) {
    msgEl.textContent = `${results.length}件 見つかりました`;
    results.forEach(item => {
      container.appendChild(createListItem(item));
    });
  } else {
    msgEl.textContent = '見つかりませんでした。ほかの言葉でさがしてください。';
  }
}

// ルーティング
function handleHashChange() {
  document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
  const hash = location.hash || '#home';
  
  if (hash === '#list') {
    renderList();
    document.getElementById('view-list').classList.add('active');
  } else if (hash === '#search') {
    document.getElementById('search-result-container').innerHTML = '';
    document.getElementById('search-result-msg').textContent = '';
    document.getElementById('search-input').value = '';
    document.getElementById('view-search').classList.add('active');
  } else if (hash === '#bangai') {
    renderBangai();
    document.getElementById('view-bangai').classList.add('active');
  } else {
    document.getElementById('view-home').classList.add('active');
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', handleHashChange);

// --- 音声読み上げ機能 ---
let speechState = {
  isOn: false,
  sentences: [],
  currentIndex: 0
};

function cleanTextForSpeech(doc) {
  const texts = [];
  
  function extractAndAdd(element) {
    if (!element) return;
    const clone = element.cloneNode(true);
    
    // 読まない要素を削除
    const removes = clone.querySelectorAll('script, style, img, a, .backno, .coverHint, .coverNote, .pageno, #tomenu, .nav, #dots');
    removes.forEach(el => el.remove());
    
    // この絵本の読み方 で始まる .sanko は除外
    if (clone.classList.contains('sanko') && clone.textContent.trim().startsWith('この絵本の読み方')) {
      return;
    }
    
    let htmlStr = clone.innerHTML;
    // h1内の<br>を改行に
    htmlStr = htmlStr.replace(/<br\s*\/?>/gi, '\n');
    clone.innerHTML = htmlStr;
    
    let text = clone.textContent.trim();
    if (!text) return;
    
    // まとん直し：絵本の箱は「⚠ ここがきけん！」のように言葉も書いてあるので、絵文字は消すだけ（二度読まない）
    text = text.replace(/[⚠📘☝]️?/gu, '');
               
    // 文で分割 (。！？改行)
    // まとん直し：「…だった。」の閉じかっこを次の文の頭に回さない（句点のすぐ後がかっこ・句点なら、まだ切らない）
    const parts = text.split(/(?<=[。！？])(?![」』）)。！？])|\n/);
    parts.forEach(p => {
      const t = p.replace(/\n/g, '').trim();
      if (t) texts.push(t);
    });
  }

  // h1, h2
  extractAndAdd(doc.querySelector('h1'));
  extractAndAdd(doc.querySelector('h2'));
  
  // 各ページ
  doc.querySelectorAll('.page').forEach(page => {
    page.querySelectorAll('p.scene').forEach(extractAndAdd);
    const kv = page.querySelector('.kv');
    if (kv) {
      kv.querySelectorAll('.box.danger').forEach(extractAndAdd);
      kv.querySelectorAll('.box.sanko').forEach(extractAndAdd);
      kv.querySelectorAll('.box.yakusoku').forEach(extractAndAdd);
    }
  });
  
  extractAndAdd(doc.querySelector('.fin'));
  return texts;
}

// ===== ここから下は まとん直し（人類創世アプリ v02・v04 と同じ形の読み上げ）=====
// LINE などアプリの中のブラウザには読み上げ（speechSynthesis）が無い。無くても画面とほかのボタンは動くようにする
const synth = window.speechSynthesis || null;
let speechUtterance = null;   // 今読んでいる文（古い文の知らせで先へ進まないように見分ける）
let speechFails = 0;          // 同じ文で続けて切られた回数
let speechWatchTimer = null;  // 見張りの時計
let speechWaitTimer = null;   // cancel のあと少しあける時計
let wakeLock = null;          // 読んでいる間は画面を消さない
let speechNo = null;          // 読んでいる巻の番号（読んだ所を巻ごとに覚える）
let jaVoice = null;

function loadVoices() {
  if (!synth) return;
  jaVoice = synth.getVoices().find(v => v.lang.startsWith('ja')) || null;
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

function showSpeechNote(msg) {
  const note = document.getElementById('speech-note');
  note.textContent = msg;
  note.style.display = msg ? 'block' : 'none';
}

function setPauseButtons(reading) {
  document.getElementById('btn-speech-pause').style.display = reading ? 'block' : 'none';
  document.getElementById('btn-speech-resume').style.display = reading ? 'none' : 'block';
}

async function startSpeechSequence() {
  if (!synth) {
    document.getElementById('speech-error').style.display = 'block';
    return;
  }
  if (!appData || !appData.hon || appData.hon.length === 0) return;
  haltSpeech();

  const ui = document.getElementById('speech-ui');
  ui.classList.add('active');
  document.getElementById('speech-progress').textContent = '絵本を読みこんでいます...';
  document.getElementById('speech-current-text').textContent = '';
  document.getElementById('speech-choice').style.display = 'none';
  showSpeechNote('');
  document.getElementById('btn-speech-pause').style.display = 'none';
  document.getElementById('btn-speech-resume').style.display = 'none';

  try {
    const res = await fetch(appData.hon[0].page, { cache: 'no-store' });
    const htmlText = await res.text();
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');
    speechState.sentences = cleanTextForSpeech(doc);
    speechNo = appData.hon[0].no;
  } catch (e) {
    document.getElementById('speech-progress').textContent = '読みこめませんでした。電波のよい所で、もう一度押してください。';
    return;
  }
  if (speechState.sentences.length === 0) {
    document.getElementById('speech-progress').textContent = '読める文章がありませんでした。';
    return;
  }

  // 前に聞いた所が残っていたら「前の続きから」「最初から」をえらんでもらう
  const saved = loadSpeechPos();
  if (saved > 0) {
    speechState.currentIndex = saved;
    showSpeechWhere(saved);
    document.getElementById('speech-current-text').textContent = speechState.sentences[saved];
    document.getElementById('btn-speech-tsuzuki').textContent = `前の続きから聞く（${saved + 1}文目から）`;
    document.getElementById('speech-choice').style.display = 'block';
    return;
  }
  startSpeechAt(0);
}

// ボタンから読み始める：今しゃべっていたら cancel して 250ms あけてから読む
function startSpeechAt(index) {
  if (!synth) { document.getElementById('speech-error').style.display = 'block'; return; }
  clearSpeechTimers();
  speechState.isOn = true;
  speechFails = 0;
  speechUtterance = null;
  showSpeechNote('');
  document.getElementById('speech-choice').style.display = 'none';
  setPauseButtons(true);
  takeWakeLock();
  if (synth.speaking || synth.pending) {
    synth.cancel();
    speechWaitTimer = setTimeout(() => { if (speechState.isOn) playSentence(index); }, 250);
  } else {
    playSentence(index);
  }
}

function playSentence(index) {
  clearSpeechTimers();
  if (index >= speechState.sentences.length) {
    // 読み終わり：画面の仕掛けを放し、覚えた所も消す
    speechState.isOn = false;
    speechUtterance = null;
    releaseWakeLock();
    clearSpeechPos();
    speechState.currentIndex = 0;
    document.getElementById('speech-progress').textContent = '読み終わりました。';
    document.getElementById('speech-current-text').textContent = '';
    document.getElementById('btn-speech-pause').style.display = 'none';
    document.getElementById('btn-speech-resume').style.display = 'none';
    return;
  }
  speechState.currentIndex = index;
  const text = speechState.sentences[index];
  showSpeechWhere(index);
  document.getElementById('speech-current-text').textContent = text;
  saveSpeechPos(index);

  // 文のつなぎ目では cancel() しない（Android の Chrome で次の文が落ちる・切られるため）
  const u = new SpeechSynthesisUtterance(text);
  speechUtterance = u;
  if (jaVoice) u.voice = jaVoice;
  u.lang = 'ja-JP';
  u.rate = 1.0;
  // 止めた時（cancel）も onerror('interrupted') や onend が来るので、読み上げ中で、しかも今の文の知らせの時だけ進む
  u.onend = () => {
    if (!(speechState.isOn && u === speechUtterance)) return;
    speechFails = 0;
    playSentence(speechState.currentIndex + 1);
  };
  // 自分で止めていないのに切られた時は、同じ文を読み直す
  u.onerror = () => {
    if (speechState.isOn && u === speechUtterance) retrySpeech(false);
  };
  if (synth.paused) synth.resume();
  synth.speak(u);
  watchSpeech(u, text.length);
}

// 一時停止・止める（Android の Chrome は pause()/resume() が効かないので、印を下ろして cancel）
function haltSpeech() {
  speechState.isOn = false;
  clearSpeechTimers();
  speechUtterance = null;
  if (synth) synth.cancel();
  releaseWakeLock();
}

function pauseSpeech() {
  haltSpeech();
  setPauseButtons(false);
  showSpeechNote('一時停止中です。『つづきから』を押すと、この文の頭から読みます');
}

// いつ押しても、今の文の頭から読み直す
function resumeSpeech() {
  startSpeechAt(speechState.currentIndex);
}

function stopSpeech() {
  haltSpeech(); // 聞いた所は覚えたまま（次に押した時「前の続きから」をえらべる）
  document.getElementById('speech-ui').classList.remove('active');
}

// 切られた・黙った時：同じ文を1秒後に読み直す。同じ文で3回続けてだめなら止めて知らせる
function retrySpeech(needCancel) {
  clearSpeechTimers();
  speechUtterance = null;
  if (needCancel && synth) synth.cancel();
  speechFails++;
  if (speechFails >= 3) {
    speechState.isOn = false;
    releaseWakeLock();
    setPauseButtons(false);
    showSpeechNote('止まりました。『つづきから』を押すと、この文から読みます');
    return;
  }
  speechWaitTimer = setTimeout(() => { if (speechState.isOn) playSentence(speechState.currentIndex); }, 1000);
}

// 見張り：1文ごとに時計（字数×0.3秒＋8秒）。終わりの知らせが来ないまま過ぎたら読み直す
function watchSpeech(u, len) {
  const ms = len * 300 + 8000;
  speechWatchTimer = setTimeout(() => {
    if (!(speechState.isOn && u === speechUtterance)) return;
    if (!synth || !synth.speaking) { retrySpeech(false); return; }
    speechWatchTimer = setTimeout(() => {
      if (speechState.isOn && u === speechUtterance) retrySpeech(true);
    }, ms);
  }, ms);
}

function clearSpeechTimers() {
  clearTimeout(speechWatchTimer);
  clearTimeout(speechWaitTimer);
  speechWatchTimer = null;
  speechWaitTimer = null;
}

// 今の所を「その71　全部で80文のうち12文目」のように出す
function showSpeechWhere(index) {
  const label = (appData && appData.hon && appData.hon[0]) ? appData.hon[0].label + '　' : '';
  document.getElementById('speech-progress').textContent = `${label}全部で${speechState.sentences.length}文のうち${index + 1}文目`;
}

// 聞いた所を巻ごとに覚える（キーに巻の番号を入れる。文の字もいっしょに覚えて確かめる）
function speechPosKey() { return 'ky_app_speech_pos_' + speechNo; }
function saveSpeechPos(index) {
  try { localStorage.setItem(speechPosKey(), JSON.stringify({ i: index, t: speechState.sentences[index] })); } catch (e) {}
}
function clearSpeechPos() {
  try { localStorage.removeItem(speechPosKey()); } catch (e) {}
}
function loadSpeechPos() {
  try {
    const p = JSON.parse(localStorage.getItem(speechPosKey()) || 'null');
    if (!p || typeof p.t !== 'string') return 0;
    if (speechState.sentences[p.i] === p.t) return p.i;
    const found = speechState.sentences.indexOf(p.t);
    return found > 0 ? found : 0;
  } catch (e) { return 0; }
}

// 画面を消さない仕掛け（使えないスマホ・断られた時は何もしない）
async function takeWakeLock() {
  try {
    if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
    const lock = await navigator.wakeLock.request('screen');
    if (!speechState.isOn) { lock.release().catch(() => {}); return; }
    wakeLock = lock;
    lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
  } catch (e) {}
}
function releaseWakeLock() {
  const lock = wakeLock;
  wakeLock = null;
  try { if (lock) lock.release().catch(() => {}); } catch (e) {}
}
// 画面がもどった時、読み上げ中なら画面を消さない仕掛けを取り直す
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && speechState.isOn) takeWakeLock();
});

// 音声読み上げボタンイベント
document.getElementById('btn-start-speech').addEventListener('click', startSpeechSequence);
document.getElementById('btn-speech-pause').addEventListener('click', pauseSpeech);
document.getElementById('btn-speech-resume').addEventListener('click', resumeSpeech);
document.getElementById('btn-speech-stop').addEventListener('click', stopSpeech);
document.getElementById('btn-speech-tsuzuki').addEventListener('click', () => startSpeechAt(speechState.currentIndex));
document.getElementById('btn-speech-hajime').addEventListener('click', () => startSpeechAt(0));
// ===== まとん直し ここまで =====

// 初期化
loadData();
handleHashChange();

// まとん直し：電波が無い所でも開けるように（https の時だけ）
if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>
